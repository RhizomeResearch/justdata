[project]
name = "justdata"
version = "0.1.0"
description = "A TensorFlow-native data pipeline library with a modality-neutral core and first-class computer vision and acoustic recipes"
readme = "README.md"
authors = [
    { name = "clementpoiret", email = "clement@linux.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "loguru>=0.7.3",
    "tensorflow>=2.18.1",
    "tensorflow-datasets>=4.9.9",
]

[project.optional-dependencies]
vision = [
    "datasets[vision]>=4.5.0",
    "filelock>=3.20",
]
wilds = [
    "wilds>=2.0.0",
]
acoustic = [
    "datasets[audio]>=4.5.0",
    "soundfile>=0.12",
    "soxr>=0.5",
    "librosa>=0.11",
    "torch==2.10.0",
    "torchcodec==0.10.0",
]
golden = [
    "torchaudio==2.10.0",
    "torchlibrosa==0.1.0",
]
dev = [
    "datasets[audio]>=4.5.0",
    "datasets[vision]>=4.5.0",
    "filelock>=3.20",
    "librosa>=0.11",
    "matplotlib>=3.10.8",
    "pytest>=9.0.2",
    "ruff==0.15.20",
    "soundfile>=0.12",
    "soxr>=0.5",
    "torch==2.10.0",
    "torchcodec==0.10.0",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "datasets[audio]>=4.5.0",
    "datasets[vision]>=4.5.0",
    "filelock>=3.20",
    "librosa>=0.11",
    "matplotlib>=3.10.8",
    "pytest>=9.0.2",
    "ruff==0.15.20",
    "soundfile>=0.12",
    "soxr>=0.5",
    "torch==2.10.0",
    "torchcodec==0.10.0",
]

[tool.pytest.ini_options]
addopts = ["-m", "not golden"]
markers = [
    "acoustic: acoustic pipeline tests",
    "golden: optional tests requiring external reference packages/checkpoints",
    "slow: long-running tests",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
